<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Billing System</title>
    <link rel="icon" href="assets/logo.png" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/screens.css" />
    <!-- Prototype layer: start screen, review notes, simulators -->
    <link rel="stylesheet" href="css/prototype.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="layers"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="print-root" class="print-root"></div>

    <!-- Classic scripts, in dependency order, so the page opens from the file system. -->
    <!-- ============ Application: the Billing System ============ -->
    <script src="js/util.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/store.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/screens/dashboard.js"></script>
    <script src="js/screens/patients.js"></script>
    <script src="js/screens/charges.js"></script>
    <script src="js/screens/exceptions.js"></script>
    <script src="js/screens/claims.js"></script>
    <script src="js/screens/payments.js"></script>
    <script src="js/screens/denials.js"></script>
    <script src="js/screens/ar.js"></script>
    <script src="js/screens/reports.js"></script>
    <script src="js/screens/admin.js"></script>

    <!-- ============ Prototype layer: never referenced by the application ============ -->
    <script src="js/prototype/environment.js"></script>
    <script src="js/prototype/simulators.js"></script>
    <script src="js/prototype/review-notes.js"></script>
    <script src="js/prototype/boot.js"></script>

    <script src="js/app.js"></script>
  </body>
</html>
